<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LittleStar | My Orders</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/cart-checkout.css}">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff5f8; margin: 0; padding: 0; }
        header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fce4ec; position: sticky; top: 0; z-index: 1000; }
        .home-btn { text-decoration: none; font-size: 24px; color: #ad1457; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #ad1457; margin-bottom: 30px; font-size: 24px; border-left: 5px solid #ff6bad; padding-left: 15px; }
        .order-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #fce4ec; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #fce4ec; padding-bottom: 15px; margin-bottom: 15px; }
        .order-id { font-weight: bold; color: #333; background: #fce4ec; padding: 4px 10px; border-radius: 6px; font-family: monospace; }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-placed { background: #e3f2fd; color: #1976d2; }
        .status-shipped { background: #fff3e0; color: #f57c00; }
        /* Existing styles... */
        .status-delivered { background: #e8f5e9; color: #4caf50; }
        .status-cancelled { background: #ffebee; color: #d32f2f; }
        /* NEW: Add these for Return and Exchange */
        .status-return { background: #f3e5f5; color: #7b1fa2; }    /* Light Purple */
        .status-exchange { background: #e0f7fa; color: #00796b; }  /* Teal/Cyan */
        .product-brief { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .product-img { width: 60px; height: 75px; object-fit: cover; border-radius: 8px; border: 1px solid #fce4ec; }
        .action-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; padding-top: 15px; border-top: 1px solid #fafafa; }
        .btn { padding: 10px 20px; border-radius: 25px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; border: none; display: inline-block; }
        .btn-track { background: #ff6bad; color: white; }
        .btn-track:hover { background: #ad1457; }
        .btn-cancel { background: #f5f5f5; color: #666; border: 1px solid #ddd; }
        .btn-cancel:hover { background: #eeeeee; color: #333; }
        .btn-return { border: 2px solid #ff6bad; color: #ff6bad; background: white; }
        .btn-return:hover { background: #fff5f8; }
        .empty-state { text-align: center; padding: 50px; color: #999; }
    </style>
</head>
<body>

<header>
    <div style="flex: 1;"><a href="/shop" class="logo-link">LITTLESTAR</a></div>
    <div style="flex: 2; text-align: center;"><h1 style="color: #ad1457; margin: 0; font-size: 20px;">LITTLESTAR</h1></div>
    <div style="flex: 1; text-align: right;"><a href="/cart" style="text-decoration: none;">🛒</a></div>
</header>

<div class="container">
    <h1>My Order History</h1>

    <div class="order-card" th:if="${orderId != null}">
        <div class="order-header">
            <div>
                <span style="color: #888; font-size: 14px;">Order</span>
                <span class="order-id" th:text="${orderId}">BBL-ID-HERE</span>
            </div>
            <!-- Replace the existing status-badge span with this -->
            <span class="status-badge"
                  th:classappend="${status == 'CANCELLED' ? 'status-cancelled' :
                      (status == 'DELIVERED' ? 'status-delivered' :
                      (status == 'RETURN_INITIATED' ? 'status-return' :
                      (status == 'EXCHANGE_INITIATED' ? 'status-exchange' : 'status-placed')))}"
                  th:text="${status != null ? status : 'PLACED'}">PLACED</span>
        </div>

        <div class="product-brief">
            <!-- Fixed placeholder to avoid broken image icon -->
            <img src="https://via.placeholder.com/60x75/ff6bad/ffffff?text=Order" class="product-img" alt="Product">
            <div>
                <div style="font-weight: bold; color: #333;">Order for <span th:text="${customerName}">Customer</span></div>
                <div style="font-size: 13px; color: #777;" th:text="${deliveryAddress}">Shipping Address</div>
            </div>
        </div>

        <div class="action-group">
            <!-- Tracking: Hidden if cancelled -->
            <a th:if="${status != 'CANCELLED'}"
               th:href="@{/order/track(orderId=${orderId})}"
               class="btn btn-track">TRACK ORDER</a>

            <!-- Cancel: Only shows if status is PLACED -->
            <form th:if="${status == 'PLACED'}" action="/order/cancel" method="post">
                <input type="hidden" name="orderId" th:value="${orderId}">
                <button type="submit" class="btn btn-cancel">CANCEL ORDER</button>
            </form>

            <!-- Return/Exchange: Only show if status is DELIVERED -->
            <div th:if="${status == 'DELIVERED'}" style="display: flex; gap: 10px;">
                <a th:href="@{/order/return(orderId=${orderId})}" class="btn btn-return">RETURN</a>
                <a th:href="@{/order/exchange(orderId=${orderId})}" class="btn btn-return">EXCHANGE</a>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${orderId == null}">
        <p>You haven't placed any orders yet.</p>
        <a href="/shop" style="color: #ff6bad; font-weight: bold;">Start Shopping</a>
    </div>
</div>

</body>
</html>
