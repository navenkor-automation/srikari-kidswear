<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TinySmiles | Track Order</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #fff5f8; margin: 0; padding: 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .track-container { background: white; padding: 25px 20px; border-radius: 16px; max-width: 500px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #fce4ec; box-sizing: border-box; }

        h2 { color: #ad1457; margin-top: 0; font-size: 18px; margin-bottom: 8px; word-break: break-all; }
        p { font-size: 14px; margin-top: 0; color: #555; }

        /* Desktop Style: Horizontal Progress Bar */
        .status-bar { display: flex; justify-content: space-between; margin-top: 35px; position: relative; padding: 0 10px; }
        .status-bar::before { content: ''; position: absolute; top: 12px; left: 0; right: 0; height: 4px; background: #f5f5f5; z-index: 1; border-radius: 2px; }

        .step { position: relative; z-index: 2; text-align: center; width: 80px; display: flex; flex-direction: column; align-items: center; }
        .dot { width: 24px; height: 24px; background: #e0e0e0; border-radius: 50%; margin-bottom: 8px; border: 4px solid white; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        label { font-size: 12px; color: #777; font-weight: 500; }

        /* Active Highlights */
        .step.active .dot { background: #ff6bad; box-shadow: 0 0 8px rgba(255,107,173,0.6); border-color: white; }
        .step.active label { color: #ad1457; font-weight: bold; }

        .back-btn { color: #ff6bad; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 25px; font-size: 14px; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
        .back-btn:hover { color: #ad1457; }

        /* Ajio Mobile View Logic: Turns into a Vertical Timeline */
        @media (max-width: 500px) {
            .status-bar { flex-direction: column; gap: 30px; margin-top: 30px; padding-left: 20px; position: relative; }
            .status-bar::before { top: 0; bottom: 0; left: 30px; width: 4px; height: auto; }
            .step { flex-direction: row; gap: 15px; width: 100%; text-align: left; }
            .dot { margin-bottom: 0; flex-shrink: 0; }
            label { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="track-container">
    <h2>Tracking Order: <span th:text="${orderId}">ID</span></h2>
    <p>Current Status: <strong style="color: #ff6bad;" th:text="${status}">PLACED</strong></p>

    <div class="status-bar">
        <div class="step" th:classappend="${status == 'PLACED' || status == 'SHIPPED' || status == 'DELIVERED' || status == 'RETURN_INITIATED' || status == 'EXCHANGE_INITIATED'} ? 'active' : ''">
            <div class="dot"></div>
            <label>Placed</label>
        </div>

        <div class="step" th:classappend="${status == 'SHIPPED' || status == 'DELIVERED'} ? 'active' : ''">
            <div class="dot"></div>
            <label>Shipped</label>
        </div>

        <div class="step" th:classappend="${status == 'DELIVERED'} ? 'active' : ''">
            <div class="dot"></div>
            <label>Delivered</label>
        </div>
    </div>

    <a href="/order/history" class="back-btn">&larr; Back to My Orders</a>
</div>

</body>
</html>
