<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Order | LittleStar</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff5f8; padding: 40px; }
        .track-container { background: white; padding: 30px; border-radius: 15px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #fce4ec; }
        .status-bar { display: flex; justify-content: space-between; margin-top: 30px; position: relative; }
        .status-bar::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 4px; background: #eee; z-index: 1; }
        .step { position: relative; z-index: 2; text-align: center; width: 90px; }
        .dot { width: 30px; height: 30px; background: #ddd; border-radius: 50%; margin: 0 auto 10px; border: 4px solid white; transition: 0.3s; }

        /* Active Status Highlights */
        .step.active .dot { background: #ff6bad; box-shadow: 0 0 10px rgba(255,107,173,0.5); }
        .step.active label { color: #ad1457; font-weight: bold; }
        label { font-size: 13px; color: #666; }
    </style>
</head>
<body>
<div class="track-container">
    <h2 style="color: #ad1457; margin-top: 0;">Tracking Order: <span th:text="${orderId}">ID</span></h2>
    <p style="font-size: 16px;">Current Status: <strong style="color: #ff6bad;" th:text="${status}">PLACED</strong></p>

    <div class="status-bar">
        <div class="step" th:classappend="${status == 'PLACED' || status == 'SHIPPED' || status == 'DELIVERED' || status == 'RETURN_INITIATED' || status == 'EXCHANGE_INITIATED'} ? 'active' : ''">
            <div class="dot"></div>
            <label>Placed</label>
        </div>
        <div class="step" th:classappend="${status == 'SHIPPED' || status == 'DELIVERED'} ? 'active' : ''">
            <div class="dot"></div>
            <label>Shipped</label>
        </div>
        <div class="step" th:classappend="${status == 'DELIVERED'} ? 'active' : ''">
            <div class="dot"></div>
            <label>Delivered</label>
        </div>
    </div>

    <br><br>
    <a href="/order/history" style="color: #ff6bad; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px;">&larr; Back to My Orders</a>
</div>
</body>
</html>
