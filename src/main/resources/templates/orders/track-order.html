<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Track Order | LittleStar</title>
    <style>
        body { font-family: sans-serif; background-color: #fff5f8; padding: 40px; }
        .track-container { background: white; padding: 30px; border-radius: 15px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-bar { display: flex; justify-content: space-between; margin-top: 30px; position: relative; }
        .status-bar::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 4px; background: #eee; z-index: 1; }
        .step { position: relative; z-index: 2; text-align: center; width: 80px; }
        .dot { width: 30px; height: 30px; background: #ddd; border-radius: 50%; margin: 0 auto 10px; border: 4px solid white; }
        .step.active .dot { background: #ff6bad; }
        .step.active label { color: #ad1457; font-weight: bold; }
    </style>
</head>
<body>
<div class="track-container">
    <h2>Tracking Order: <span th:text="${orderId}">ID</span></h2>
    <p>Status: <strong th:text="${status}">PLACED</strong></p>

    <div class="status-bar">
        <div class="step active"><div class="dot"></div><label>Placed</label></div>
        <div class="step"><div class="dot"></div><label>Shipped</label></div>
        <div class="step"><div class="dot"></div><label>Out for Delivery</label></div>
        <div class="step"><div class="dot"></div><label>Delivered</label></div>
    </div>
    <br><br>
    <a href="/order/history" style="color: #ff6bad; text-decoration: none;">← Back to My Orders</a>
</div>
</body>
</html>
