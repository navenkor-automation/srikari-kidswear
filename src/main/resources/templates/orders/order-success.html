<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LittleStar | Order Confirmed!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff5f8; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .success-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 90%; }
        .icon-circle { width: 80px; height: 80px; background: #e8f5e9; color: #4caf50; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }
        h1 { color: #ad1457; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
        .order-id { font-weight: bold; color: #333; background: #fce4ec; padding: 5px 12px; border-radius: 5px; font-family: monospace; }
        .details-box { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 15px; margin: 20px 0; text-align: left; }
        .continue-btn { display: inline-block; background: #ff6bad; color: white; text-decoration: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .continue-btn:hover { background: #ad1457; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">✓</div>
    <h1>Thank You, <span th:text="${customerName}">Customer</span>!</h1>
    <p>Your order has been placed successfully. We're getting it ready for your little one!</p>

    <div class="details-box">
        <div style="margin-bottom: 10px;"><strong>Order ID:</strong> <span class="order-id" th:text="${orderId}">BBL-12345</span></div>
        <div><strong>Shipping to:</strong></div>
        <div style="color: #888; font-size: 14px; margin-top: 5px;" th:text="${deliveryAddress}">123 Street Address, City</div>
    </div>

    <p style="font-size: 14px;">A confirmation email has been sent to your registered address.</p>

    <a href="/shop" class="continue-btn">CONTINUE SHOPPING</a>
</div>

</body>
</html>
