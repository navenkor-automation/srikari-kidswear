<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Srikari Kidswear | Sign In - Sign Up</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%23ff6bad'/><text x='50%25' y='68%25' font-size='60' font-weight='900' font-family='Arial, sans-serif' fill='white' text-anchor='middle'>S</text></svg>">

    <style>
        /* --- GLOBAL SMOOTH MOVEMENT FIXES --- */
        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfafb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(255, 107, 173, 0.08);
            width: 380px;
            text-align: center;
            border: 1px solid #fce4ec;
            box-sizing: border-box;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 900;
            color: #222;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .brand-name span { color: #ff6bad; }

        .sub-title {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 🔥 CRITICAL FIX: Font size strictly 16px to bypass mobile auto-zoom trigger 🔥 */
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 30px;
            box-sizing: border-box;
            font-size: 16px !important;
            color: #333;
            background: #fdfdfd;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: #ff6bad;
            background: white;
            box-shadow: 0 0 8px rgba(255, 107, 173, 0.15);
        }

        .btn-continue {
            width: 100%;
            padding: 14px;
            background-color: #ff6bad;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(255, 107, 173, 0.2);
        }
        .btn-continue:hover {
            background-color: #ad1457;
        }

        .error-box {
            background-color: #fdf2f2;
            color: #ec5b5b;
            border: 1px solid #fbe5e5;
            padding: 12px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            border-radius: 30px;
        }

        .terms-text {
            font-size: 11px;
            color: #999;
            margin-top: 25px;
            line-height: 1.6;
        }
        .terms-text a { color: #ff6bad; text-decoration: none; font-weight: 600; }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
                box-shadow: none;
                border: none;
                background: transparent;
            }
            body { background-color: white; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-name">srikari<span>kids</span></div>
    <div class="sub-title">Welcome to Kids Wear Shopping</div>

    <div th:if="${error}" class="error-box" th:text="${error}">Error Message</div>

    <form th:action="@{/login}" method="POST" autocomplete="off">

        <div th:if="${step == null || step == 'mobile'}">
            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="text" id="mobileNumber" name="mobileNumber" placeholder="Enter 10 digit mobile number" th:value="${mobileNumber}" required pattern="[0-9]{10}">
            </div>
            <input type="hidden" name="formStep" value="SUBMIT_MOBILE">
            <button type="submit" class="btn-continue">Continue</button>
        </div>

        <div th:if="${step == 'otp'}">
            <div class="form-group">
                <label for="otp">Enter 4-Digit OTP</label>
                <input type="text" id="otp" name="otp" placeholder="Enter OTP (Use 1234 for testing)" required>
            </div>
            <input type="hidden" name="mobileNumber" th:value="${mobileNumber}">
            <input type="hidden" name="formStep" value="SUBMIT_OTP">
            <button type="submit" class="btn-continue">Verify OTP</button>
        </div>

        <div th:if="${step == 'register'}">
            <div class="form-group">
                <label th:text="'Complete Profile for: ' + ${mobileNumber}" style="color: #ff6bad; font-size: 13px; text-transform: none; font-weight: 700;"></label>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" th:value="${fullName}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" placeholder="Enter your email address" th:value="${email}" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male" th:selected="${gender == 'Male'}">Male</option>
                    <option value="Female" th:selected="${gender == 'Female'}">Female</option>
                    <option value="Other" th:selected="${gender == 'Other'}">Other</option>
                </select>
            </div>

            <input type="hidden" name="mobileNumber" th:value="${mobileNumber}">
            <input type="hidden" name="formStep" value="SUBMIT_REGISTER">
            <button type="submit" class="btn-continue">Register & Continue</button>
        </div>

    </form>

    <div class="terms-text">
        By proceeding, you agree to our <a href="#">Terms of Use</a> &amp; <a href="#">Privacy Policy</a>
    </div>
</div>

</body>
</html>
