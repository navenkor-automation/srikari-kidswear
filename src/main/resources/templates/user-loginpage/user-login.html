<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Srikari Kidswear | Login</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #fff5f8; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; padding: 30px 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.03); max-width: 420px; width: 90%; border: 1px solid #fce4ec; box-sizing: border-box; }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-link { font-size: 24px; font-weight: 900; color: #ff6bad; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        h2 { color: #ad1457; font-size: 16px; text-transform: uppercase; margin-top: 0; margin-bottom: 20px; text-align: center; letter-spacing: 0.5px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #555; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .form-input { width: 100%; padding: 13px 16px; border: 1px solid #ddd; border-radius: 25px; font-size: 14px; outline: none; box-sizing: border-box; transition: 0.2s; -webkit-appearance: none; }
        .form-input:focus { border-color: #ff6bad; box-shadow: 0 0 6px rgba(255,107,173,0.2); }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-label { font-size: 14px; color: #333; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .radio-label input { accent-color: #ff6bad; width: 16px; height: 16px; }
        .error-msg { background: #ffebee; color: #d32f2f; padding: 12px; border-radius: 25px; font-size: 13px; margin-bottom: 20px; text-align: center; font-weight: 500; border: 1px solid #ffcdd2; }
        .action-btn { display: block; background: #ff6bad; color: white; border: none; padding: 14px; width: 100%; border-radius: 25px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; box-shadow: 0 4px 12px rgba(255,107,173,0.3); text-transform: uppercase; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .action-btn:hover { background: #ad1457; }
        .info-text { font-size: 12px; color: #888; text-align: center; margin-top: 15px; line-height: 1.4; }
        .info-text a { color: #ff6bad; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-box">
        <a href="/shop" class="logo-link">Srikari Kidswear</a>
    </div>

    <div class="error-msg" th:if="${error != null}" th:text="${error}">Error Message</div>

    <form action="/login" method="post" id="mainLoginForm">

        <div th:if="${step == 'mobile'}">
            <h2>Welcome to Srikari!</h2>
            <input type="hidden" name="formStep" value="SUBMIT_MOBILE">

            <div class="input-group">
                <label>Enter Mobile Number</label>
                <input type="tel" name="mobileNumber" class="form-input" placeholder="10-digit mobile number"
                       pattern="[0-9]{10}" inputmode="numeric" maxlength="10" required autofocus>
            </div>
            <button type="submit" class="action-btn">CONTINUE</button>
            <p class="info-text">By continuing, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a></p>
        </div>

        <div th:if="${step == 'otp'}">
            <h2>Verify with OTP</h2>
            <input type="hidden" name="formStep" value="SUBMIT_OTP">
            <input type="hidden" name="mobileNumber" th:value="${mobileNumber}">

            <div class="input-group">
                <label>OTP Sent to <span th:text="${mobileNumber}" style="color:#ad1457; font-weight:bold;">Mobile</span></label>
                <input type="text" name="otp" class="form-input" placeholder="Enter 4-digit OTP (Use 1234)"
                       inputmode="numeric" maxlength="4" required autofocus>
            </div>
            <button type="submit" class="action-btn">VERIFY OTP</button>
            <p class="info-text">Didn't receive? <a href="#" onclick="alert('OTP resent successfully!')">Resend OTP</a></p>
        </div>

        <div th:if="${step == 'register'}">
            <h2>Complete Your Profile</h2>
            <input type="hidden" name="formStep" value="SUBMIT_REGISTER">
            <input type="hidden" name="mobileNumber" th:value="${mobileNumber}">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="fullName" class="form-input" placeholder="Enter your full name" th:value="${fullName}" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="name@gmail.com" th:value="${email}" required>
            </div>

            <div class="input-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="gender" value="Male" th:checked="${gender == 'Male' || gender == null}"> Male
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gender" value="Female" th:checked="${gender == 'Female'}"> Female
                    </label>
                </div>
            </div>

            <button type="submit" class="action-btn">REGISTER & SIGN IN</button>
        </div>

    </form>
</div>

</body>
</html>
