<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>LittleStar | Checkout</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff5f8; margin: 0; padding: 0; }

    header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fce4ec; position: sticky; top: 0; z-index: 1000; }
    .home-btn { text-decoration: none; font-size: 24px; color: #ad1457; }

    /* Layout from previous fixes */
    .checkout-wrapper { max-width: 1100px; margin: 30px auto; display: flex; flex-wrap: wrap; gap: 30px; padding: 0 20px; align-items: flex-start; }
    .left-col { flex: 1.5; min-width: 350px; }
    .right-col { flex: 1; min-width: 300px; position: sticky; top: 100px; }

    .section-box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { color: #ad1457; border-bottom: 2px solid #fce4ec; padding-bottom: 10px; margin-top: 0; font-size: 1.2rem; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 13px; }
    input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box; background: #fafafa; }

    /* Payment Tab Alignment */
    .payment-tabs { display: flex; gap: 10px; margin-top: 15px; }
    .tab { flex: 1; padding: 12px 5px; text-align: center; cursor: pointer; border: 1px solid #fce4ec; border-radius: 10px; background: #fffcfd; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tab input { display: none; }
    .tab:has(input:checked) { border: 2px solid #ff6bad; background: white; box-shadow: 0 2px 8px rgba(255,107,173,0.2); }

    .method-label { font-size: 11px; font-weight: bold; color: #ad1457; margin-top: 5px; text-transform: uppercase; }
    .payment-logo { height: 20px; object-fit: contain; margin-bottom: 2px; }

    .order-summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; color: #666; font-size: 14px; }
    .total-row { border-top: 2px solid #fce4ec; padding-top: 15px; margin-top: 15px; font-weight: bold; font-size: 18px; color: #ad1457; }

    .place-order-btn { background: #ff6bad; color: white; border: none; padding: 16px; width: 100%; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 10px rgba(255,107,173,0.3); }
    .back-link { display: block; text-align: center; margin-top: 15px; color: #ad1457; text-decoration: none; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div style="flex: 1;"><a href="/shop" class="home-btn">🏠</a></div>
  <div style="flex: 2; text-align: center;"><h1 style="color: #ad1457; margin: 0; font-size: 20px; letter-spacing: 1px;">LittleStar</h1></div>
  <div style="flex: 1;"></div>
</header>

<div class="checkout-wrapper">
  <!-- Left Column: Shipping & Payment -->
  <div class="left-col">
    <div class="section-box">
      <h2>Shipping Address</h2>
      <form id="checkoutForm" action="/order/confirm" method="post">
        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="fullName" placeholder="Naveen Kumar" required>
        </div>

        <!-- Phone & Pincode Grid -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" placeholder="9876543210" required>
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" name="pincode" placeholder="500001" required>
          </div>
        </div>

        <!-- Street Address -->
        <div class="form-group">
          <label>Street Address</label>
          <input type="text" name="address" placeholder="Flat No, Apartment Name, Area" required>
        </div>

        <h2 style="margin-top: 35px;">Payment Method</h2>
        <div class="payment-tabs">
          <!-- COD -->
          <label class="tab">
            <input type="radio" name="paymentType" value="COD" checked onclick="togglePayment('cod')">
            <span style="font-size: 20px;">📦</span>
            <div class="method-label">COD</div>
          </label>

          <!-- UPI -->
          <label class="tab">
            <input type="radio" name="paymentType" value="UPI" onclick="togglePayment('upi')">
            <div style="display: flex; gap: 4px;">
              <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo.png" class="payment-logo" alt="UPI">
            </div>
            <div class="method-label">UPI</div>
          </label>

          <!-- Cards -->
          <label class="tab">
            <input type="radio" name="paymentType" value="CARD" onclick="togglePayment('card')">
            <div style="display: flex; gap: 4px;">
              <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" class="payment-logo" alt="Visa">
              <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" class="payment-logo" alt="MC">
            </div>
            <div class="method-label">Cards</div>
          </label>
        </div>

        <!-- Payment Detail Sections -->
        <div style="padding: 20px; background: #fffcfd; border-radius: 12px; margin-top: 10px; border: 1px solid #fce4ec;">
          <div id="cod-fields">
            <p style="color: #888; font-size: 13px; margin: 0;">Pay securely with cash or QR code at your doorstep.</p>
          </div>

          <div id="upi-fields" style="display: none;">
            <label>Select UPI App</label>
            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
              <img src="https://download.logo.wine/logo/PhonePe/PhonePe-Logo.wine.png" style="height: 30px; cursor: pointer;">
              <img src="https://download.logo.wine/logo/Google_Pay/Google_Pay-Logo.wine.png" style="height: 30px; cursor: pointer;">
            </div>
            <input type="text" name="upiId" placeholder="Enter UPI ID (e.g. naveen@okaxis)">
          </div>

          <div id="card-fields" style="display: none;">
            <input type="text" name="cardNumber" placeholder="Card Number" maxlength="16" style="margin-bottom: 10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <input type="text" name="expiry" placeholder="MM/YY">
              <input type="password" name="cvv" placeholder="CVV">
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Right Column: Summary -->
  <div class="right-col">
    <div class="section-box">
      <h2>Order Summary</h2>
      <div th:each="item : ${cartItems}" style="display: flex; gap: 12px; margin-bottom: 15px; align-items: center;">
        <img th:src="${item.imageUrl}" style="width: 45px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #fce4ec;">
        <div style="flex: 1;">
          <div style="font-weight: 600; font-size: 13px; color: #333;" th:text="${item.name}">Product</div>
          <div style="font-size: 11px; color: #999;" th:text="'Qty: ' + ${item.quantity}">Qty: 1</div>
        </div>
        <div style="font-weight: bold; font-size: 14px; color: #333;" th:text="'₹' + ${item.totalPrice}">₹0</div>
      </div>

      <div class="total-row" style="border-top: 1px dashed #fce4ec;">
        <div class="order-summary-item"><span>Subtotal</span><span th:text="'₹' + ${subtotal}">₹0</span></div>
        <div class="order-summary-item"><span>Shipping</span><span th:text="${shipping == 0 ? 'FREE' : '₹' + shipping}" style="color: #4caf50;">FREE</span></div>
      </div>

      <div class="order-summary-item total-row">
        <span>Total Amount</span>
        <span th:text="'₹' + ${total}">₹0</span>
      </div>

      <button type="submit" form="checkoutForm" class="place-order-btn">PLACE ORDER</button>
      <a href="/cart" class="back-link">← Edit Shopping Bag</a>
    </div>
  </div>
</div>

<script>
  function togglePayment(type) {
    document.getElementById('cod-fields').style.display = (type === 'cod') ? 'block' : 'none';
    document.getElementById('upi-fields').style.display = (type === 'upi') ? 'block' : 'none';
    document.getElementById('card-fields').style.display = (type === 'card') ? 'block' : 'none';
  }
</script>

</body>
</html>
