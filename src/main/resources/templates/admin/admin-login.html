<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff5f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h2 { color: #ff6bad; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: #ff6bad; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class='login-card'>
    <h2>Admin Login</h2>
    <form th:action="@{/login-submit}" method="get">
        <input type='text' name='user' placeholder='Username' required>
        <input type='password' name='pass' placeholder='Password' required>
        <button type='submit' class='btn-login'>Login</button>
    </form>
</div>
</body>
</html>
